valve_vision_enable: true
valve_vision_mode: "sim_depth_color_debug"
valve_vision_camera_name: "head_camera"

valve_geometry_source: "vision_overlay"
vision_override_control: true
vision_override_angle: false
vision_close_latch_source: "current_control"
vision_close_latch_frame: "world"
vision_latched_geom_max_age_s: 0.30
vision_use_latched_after_approach: false

vision_override_states:
  - "wait_task_pose"
  - "move_pregrasp"
  - "approach_grasp"

vision_grasp_point_semantics: "raw_site"
vision_use_grasp_R_base: false
valve_grasp_success_mode: "strict_topology"

vision_status_file: "/tmp/falcon_valve_vision_status.json"
vision_overlay_debug_file: "/tmp/falcon_valve_vision_overlay_debug.json"
