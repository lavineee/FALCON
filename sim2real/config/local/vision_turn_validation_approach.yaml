# Local experiment overlay: vision-overlay approach + turn-validation.
# Loads after C1 tangent-only compensation and turn_validation_no_strict_grasp.

valve_vision_enable: true
valve_vision_mode: "sim_depth_color_debug"
valve_vision_camera_name: "head_camera"
valve_vision_status_file: "/tmp/falcon_valve_vision_status.json"

valve_geometry_source: "vision_overlay"
vision_override_control: true
vision_override_angle: false
vision_close_latch_source: "current_control"
vision_close_latch_frame: "world"
vision_grasp_point_semantics: "raw_site"
vision_use_grasp_R_base: false
vision_use_latched_after_approach: false
vision_override_states:
  - "wait_task_pose"
  - "move_pregrasp"
  - "approach_grasp"

# Slightly lower entry max force for this validation batch. Turn-time force
# safety remains controlled by valve_turn_abort_contact_force_n.
valve_turn_entry_max_contact_force_n: 120.0
valve_turn_abort_contact_force_n: 200.0
