# @package _global_

domain_rand:
  # Keep the baseline RL-Gym randomization set, but narrow link-mass
  # randomization through the paired robot config to right_rubber_hand only.
  push_robots : False
  push_interval_s : [5, 16]
  max_push_vel_xy : 1.0

  randomize_base_com : False
  base_com_range:
    x : [-0.01, 0.01]
    y : [-0.01, 0.01]
    z : [-0.01, 0.01]

  randomize_link_mass : True
  # 0.700kg * [0.857, 1.143] ~= [0.600, 0.800]kg.
  link_mass_range : [0.857, 1.143]

  randomize_pd_gain : True
  kp_range : [0.9, 1.1]
  kd_range : [0.9, 1.1]

  randomize_friction : True
  friction_range : [0.25, 1.25]

  randomize_base_mass : True
  added_mass_range : [-1., 3.]

  randomize_torque_rfi : False
  rfi_lim : 0.1
  randomize_rfi_lim : False
  rfi_lim_range : [0.5, 1.5]

  randomize_ctrl_delay : True
  lower_body_ctrl_delay: True
  upper_body_ctrl_delay: True
  ctrl_delay_step_range : [0, 1]
